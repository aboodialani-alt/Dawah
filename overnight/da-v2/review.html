<title>DA Review Desk</title>
<!--V2HEAD-->
<style>
/* Layout concept: a reviewer's desk. Each drafted addition is a card with its own yes / no / change request, saved to the shared database
   so Claude can read the decisions and apply exactly those. The library itself is never edited from this page. */
.wrap{margin:0 auto;padding-inline:16px;padding-block:0 5rem}
.stage{grid-template-columns:minmax(0,1fr);max-width:56rem;margin:1.6rem auto 0;display:grid;gap:1.4rem}
h1.t{font-size:clamp(2rem,5vw,3.2rem);margin:.4rem 0 .3rem;letter-spacing:-.02em;font-weight:500}
.sub{color:var(--muted);margin:0}
.tally{display:flex;gap:1.4rem;flex-wrap:wrap;font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.tally b{display:block;font-family:var(--f-display);font-weight:500;font-size:1.8rem;color:var(--ink);line-height:1}
.item{margin-bottom:1.1rem;background:var(--card);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.item.yes{border-color:var(--accent)}.item.no{border-color:var(--warn)}.item.chg{border-color:var(--gold)}
.ih{display:grid;grid-template-columns:auto 1fr auto;gap:.2rem 1rem;padding:1.1rem 1.4rem;align-items:start}
.ih .n{grid-row:1/3;font-family:var(--f-kufi);font-size:1.7rem;color:var(--gold);width:3rem;height:3rem;display:grid;place-items:center;border:1.5px solid var(--gold);border-radius:50% 50% 50% 8px}
.ih .w{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ih h3{margin:0;font-size:1.35rem;line-height:1.25;grid-column:2}
.state{grid-column:3;grid-row:1/3;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .7rem;border-radius:99px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.item.yes .state{border-color:var(--accent);color:var(--accent)}.item.no .state{border-color:var(--warn);color:var(--warn)}.item.chg .state{border-color:var(--gold);color:var(--gold)}
.body{padding:0 1.4rem 1.2rem;border-top:1px solid var(--rule)}
.body[hidden]{display:none}
.md h4{font-family:var(--f-ui);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:1.2rem 0 .3rem}
.md p{margin:.45rem 0}.md ul{margin:.4rem 0;padding-left:1.2rem}.md li{margin:.25rem 0}
.md code{font-family:var(--f-ui);font-size:.85em}
.decide{display:grid;gap:.7rem;padding:1rem 1.4rem 1.3rem;border-top:1px solid var(--rule);background:linear-gradient(0deg,var(--accent-soft),transparent)}
.decide .row-btns button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.decide .row-btns button[data-d=no][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--paper)}.decide .row-btns button[data-d=chg][aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--paper)}
.decide textarea{width:100%;min-height:3.4rem;font:inherit;font-family:var(--f-ui);font-size:.9rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:.6rem .8rem}
.toggle{font:inherit;font-family:var(--f-ui);font-size:.8rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:.3rem 1.4rem .9rem;text-align:left}
.q{min-width:0;grid-template-columns:minmax(0,1fr);border:1.5px dashed var(--gold);border-radius:18px;padding:1.2rem 1.4rem;display:grid;gap:.8rem}
.q h2{margin:0;font-size:1.5rem}
.sync{font-family:var(--f-ui);font-size:.78rem;color:var(--muted)}
</style>
<div class="wrap">
  <main class="stage">
    <div>
      <p class="eyebrow">Review desk</p>
      <h1 class="t">Six drafts, waiting for you.</h1>
      <p class="sub" id="intro"></p>
    </div>
    <div class="tally" id="tally"></div>
    <div id="items"></div>
    <section class="q" id="qs"><h2>Questions only you can answer</h2><div class="md" id="qmd"></div>
      <label class="note-s" for="a-hijab">1. Your stance on state enforcement of hijab (so the model answer matches your view)</label><textarea id="a-hijab" style="width:100%;min-height:4rem;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:.6rem .8rem"></textarea>
      <label class="note-s" for="a-mongol">2. Mongols and Baghdad entry</label>
      <select id="a-mongol" style="width:100%;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:.5rem .7rem"><option value="">Choose…</option><option value="demote">Demote to “use with care”</option><option value="keep-corrected">Keep as an argument with the corrected wording</option></select>
      <label class="note-s" for="a-pdf">3. Regenerate the nine PDFs when the library is republished?</label>
      <select id="a-pdf" style="width:100%;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:.5rem .7rem"><option value="">Choose…</option><option value="yes">Yes, regenerate</option><option value="no">No, leave the PDFs as they are</option></select>
      <div class="row-btns"><button class="btn1" id="saveq" type="button">Save my answers</button><span class="sync" id="qsync"></span></div>
    </section>
    <p class="sync" id="sync"></p>
  </main>
</div>
<!--V2JS-->
<script>
(function () {
  const { $, $$, esc, store } = DA2;
  DA2.mountBar({ crumb: 'Review desk' });
  function md(s) {
    const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
    const out = []; let ul = false;
    s.split('\n').forEach(line => {
      const l = line.trim();
      if (/^[-*] /.test(l)) { if (!ul) { out.push('<ul>'); ul = true; } out.push('<li>' + inl(l.slice(2)) + '</li>'); return; }
      if (ul) { out.push('</ul>'); ul = false; }
      if (!l || l === '---') return;
      if (/^#{3,4} /.test(l)) { out.push('<h4>' + inl(l.replace(/^#+ /, '')) + '</h4>'); return; }
      const m = l.match(/^\*\*([^*]+)\*\*$/);
      if (m) { out.push('<h4>' + esc(m[1]) + '</h4>'); return; }
      out.push('<p>' + inl(l) + '</p>');
    });
    if (ul) out.push('</ul>');
    return out.join('');
  }
  let db = null, dec = {};
  try { dec = JSON.parse(store.get('da2:review') || '{}'); } catch (e) {}
  const save = (id, data) => { dec[id] = data; store.set('da2:review', JSON.stringify(dec)); if (db) db.doc('review/' + id).set(data).then(() => { $('#sync').textContent = 'Saved to the shared database. Claude can read it.'; }).catch(() => { $('#sync').textContent = 'Saved in this browser only.'; }); else $('#sync').textContent = 'Saved in this browser only. Open the page inside Claude to share decisions.'; };

  function paint(items) {
    const tally = { yes: 0, no: 0, chg: 0, none: 0 };
    items.forEach(it => { const d = dec['item-' + it.n]; const k = d ? d.decision : 'none'; tally[k] = (tally[k] || 0) + 1; });
    $('#tally').innerHTML = '<div><b>' + tally.yes + '</b>accepted</div><div><b>' + tally.chg + '</b>need changes</div><div><b>' + tally.no + '</b>declined</div><div><b>' + tally.none + '</b>undecided</div>';
    items.forEach(it => {
      const el = $('#it' + it.n), d = dec['item-' + it.n]; if (!el) return;
      el.className = 'item' + (d ? ' ' + d.decision : '');
      $('.state', el).textContent = d ? ({ yes: 'Accepted', no: 'Declined', chg: 'Needs changes' })[d.decision] : 'Undecided';
      $$('[data-d]', el).forEach(b => b.setAttribute('aria-pressed', String(!!d && b.dataset.d === d.decision)));
    });
  }
  fetch('review.json').then(r => r.json()).then(async j => {
    $('#intro').textContent = j.intro.replace(/\*\*/g, '').replace(/\n+/g, ' ');
    $('#items').innerHTML = j.items.map(it => {
      const [where, ...t] = it.md.split('\n'); const m = it.md.match(/^### (.*)$/m);
      return '<article class="item" id="it' + it.n + '"><div class="ih"><span class="n">' + DA2.arN(it.n) + '</span><span class="w">' + esc(it.where) + '</span><span class="state">Undecided</span><h3>' + esc(m ? m[1] : it.where) + '</h3></div>' +
        '<button class="toggle" data-t type="button">Read the draft</button><div class="body" hidden><div class="md">' + md(it.md.replace(/^### .*$/m, '')) + '</div></div>' +
        '<div class="decide"><div class="row-btns"><button class="btn2" data-d="yes" type="button">Accept</button><button class="btn2" data-d="chg" type="button">Needs changes</button><button class="btn2" data-d="no" type="button">Decline</button></div><textarea data-note placeholder="Optional: what to change, or why" aria-label="Note for this draft"></textarea></div></article>';
    }).join('');
    $('#qmd').innerHTML = md(j.questions);
    $$('.item').forEach(el => {
      const n = el.id.slice(2);
      $('[data-t]', el).onclick = e => { const b = $('.body', el); b.hidden = !b.hidden; e.target.textContent = b.hidden ? 'Read the draft' : 'Hide the draft'; };
      $$('[data-d]', el).forEach(b => b.onclick = () => { save('item-' + n, { n: +n, decision: b.dataset.d, note: $('[data-note]', el).value, at: Date.now() }); paint(j.items); });
      $('[data-note]', el).addEventListener('change', () => { const d = dec['item-' + n]; if (d) { d.note = $('[data-note]', el).value; save('item-' + n, d); } });
      const d = dec['item-' + n]; if (d && d.note) $('[data-note]', el).value = d.note;
    });
    const qd = dec['questions'] || {}; $('#a-hijab').value = qd.hijab || ''; $('#a-mongol').value = qd.mongol || ''; $('#a-pdf').value = qd.pdf || '';
    $('#saveq').onclick = () => { save('questions', { hijab: $('#a-hijab').value, mongol: $('#a-mongol').value, pdf: $('#a-pdf').value, at: Date.now() }); $('#qsync').textContent = 'Saved.'; };
    paint(j.items);
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use('db');
        if (db) db.collection('review').onSnapshot(s => { s.docs.forEach(x => { dec[x.id] = x.data(); }); store.set('da2:review', JSON.stringify(dec)); paint(j.items); }, () => {});
      }
    } catch (e) {}
  });
})();
</script>
