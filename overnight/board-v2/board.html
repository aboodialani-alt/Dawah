<title>Studio Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Reem+Kufi:wght@500&display=swap">
<style>
/* Layout concept: a studio ledger. A slim left rail switches rooms (Overview, Pipeline, Claims, Style lab, Accounts); every room reads like a
   printed ledger page with big numerals, ruled rows and one live graphic. Same lapis / brass / turquoise family as the library. */
:root{
  --paper:#e9edf4; --card:#fbfcfe; --ink:#101a33; --muted:#4b5876; --rule:#cfd7e6;
  --accent:#0a6f7a; --accent-soft:#d8edef; --accent-ink:#fff; --gold:#8d5f0c; --gold-soft:#f6edd7; --warn:#a3381a; --warn-soft:#fbebe3;
  --sA:#8d5f0c; --sB:#0a6f7a; --sC:#5a4fc4; --en:#0a6f7a; --ar:#8d5f0c; --glow:rgba(10,111,122,.16);
  --shadow:0 1px 0 rgba(16,26,51,.04),0 10px 30px -18px rgba(16,26,51,.35);
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif; --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-kufi:"Reem Kufi",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1020; --card:#111a30; --ink:#e7ecf8; --muted:#95a2c2; --rule:#223050; --accent:#4cc9c0; --accent-soft:#102e3a; --accent-ink:#06151a;
  --gold:#e2b55d; --gold-soft:#2a2414; --warn:#f2a07a; --warn-soft:#33201a; --sA:#e2b55d; --sB:#4cc9c0; --sC:#a99bff; --en:#4cc9c0; --ar:#e2b55d; --glow:rgba(76,201,192,.18);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1020; --card:#111a30; --ink:#e7ecf8; --muted:#95a2c2; --rule:#223050; --accent:#4cc9c0; --accent-soft:#102e3a; --accent-ink:#06151a;
  --gold:#e2b55d; --gold-soft:#2a2414; --warn:#f2a07a; --warn-soft:#33201a; --sA:#e2b55d; --sB:#4cc9c0; --sC:#a99bff; --en:#4cc9c0; --ar:#e2b55d; --glow:rgba(76,201,192,.18);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.8); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:17px;line-height:1.55}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.shell{display:grid;grid-template-columns:15rem minmax(0,1fr);min-height:100%}
/* rail */
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:1.2rem 1rem;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:.3rem;font-family:var(--f-ui);background:var(--paper)}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:600;font-size:.95rem;margin-bottom:1.1rem;padding:.2rem .4rem}
.logo svg{width:1.9rem;height:1.9rem;color:var(--gold)}
.logo small{display:block;font-weight:400;color:var(--muted);font-size:.7rem;letter-spacing:.06em}
.rail button.nav{display:flex;align-items:center;gap:.7rem;border:0;background:transparent;cursor:pointer;text-align:left;padding:.6rem .7rem;border-radius:10px;color:var(--muted);font-size:.9rem}
.rail button.nav svg{width:1.1rem;height:1.1rem;flex:none}
.rail button.nav:hover{color:var(--ink);background:var(--accent-soft)}
.rail button.nav[aria-current="page"]{color:var(--ink);background:var(--card);box-shadow:var(--shadow);font-weight:600}
.rail .badge{margin-left:auto;font-size:.7rem;background:var(--gold);color:var(--paper);border-radius:99px;padding:0 .45rem;min-width:1.3rem;text-align:center}
.rail .sp{flex:1}
.rail .links{display:grid;gap:.2rem;font-size:.78rem;color:var(--muted)}
.rail .links a{color:var(--muted);text-decoration:none;padding:.2rem .7rem}.rail .links a:hover{color:var(--accent)}
main{padding:1.6rem clamp(1rem,3vw,2.6rem) 5rem;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:.5rem 1rem;margin-bottom:1.6rem}
.top h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(2rem,4.4vw,3.2rem);letter-spacing:-.02em;line-height:1.05}
.top .date{font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.btn{font-family:var(--f-ui);font-size:.84rem;cursor:pointer;border-radius:99px;border:1px solid var(--rule);background:transparent;padding:.38rem .95rem;color:var(--ink);display:inline-flex;gap:.4rem;align-items:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{font-size:.76rem;padding:.2rem .7rem}
.eyebrow{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--gold);margin:0 0 .4rem}
h2.sec{font-family:var(--f-display);font-weight:500;font-size:1.5rem;margin:2.4rem 0 .8rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
h2.sec small{font-family:var(--f-ui);font-size:.78rem;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:1.1rem 1.3rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1rem}
.note-s{font-family:var(--f-ui);font-size:.78rem;color:var(--muted)}
.chip{font-family:var(--f-ui);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);border-radius:99px;padding:.1rem .55rem;color:var(--muted);white-space:nowrap}
.chip.en{border-color:var(--en);color:var(--en)}.chip.ar{border-color:var(--ar);color:var(--ar)}
.chip.A{border-color:var(--sA);color:var(--sA)}.chip.B{border-color:var(--sB);color:var(--sB)}.chip.C{border-color:var(--sC);color:var(--sC)}
.empty{font-family:var(--f-ui);color:var(--muted);padding:1.6rem;text-align:center;border:1.5px dashed var(--rule);border-radius:14px}
/* overview: conveyor */
.fronts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:1rem}
.front h3{margin:0 0 .15rem;font-weight:500;font-size:1.5rem}
.front .sub{font-family:var(--f-ui);font-size:.8rem;color:var(--muted);margin:0 0 1rem}
.belt{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:relative;margin:.4rem 0 .2rem}
.belt::before{content:"";position:absolute;left:8%;right:8%;top:1.05rem;height:2px;background:var(--rule)}
.belt div{position:relative;text-align:center;font-family:var(--f-ui);font-size:.66rem;color:var(--muted);letter-spacing:.04em}
.belt b{display:grid;place-items:center;width:2.1rem;height:2.1rem;margin:0 auto .3rem;border-radius:50%;background:var(--card);border:1.5px solid var(--rule);font-family:var(--f-display);font-weight:500;font-size:1.05rem;color:var(--ink)}
.belt div.has b{border-color:var(--c);color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent)}
.needs li,.logl li{list-style:none;display:flex;gap:.7rem;align-items:flex-start;padding:.65rem 0;border-bottom:1px solid var(--rule);font-family:var(--f-ui);font-size:.9rem}
.needs,.logl{margin:0;padding:0}
.needs li:last-child,.logl li:last-child{border:0}
.needs input[type=checkbox]{margin-top:.25rem;accent-color:var(--accent);width:1.05rem;height:1.05rem}
.needs li.done span{text-decoration:line-through;color:var(--muted)}
.logl time{flex:none;color:var(--muted);font-size:.72rem;min-width:4.8rem;padding-top:.15rem}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-ui);fill:var(--muted);font-size:11px}
.legend{display:flex;gap:1rem;font-family:var(--f-ui);font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:3px;margin-right:.35rem;vertical-align:-.05rem}
.insight{font-family:var(--f-display);font-size:1.2rem;line-height:1.35;margin:.4rem 0 0}
.meterw{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.ring{--p:0;width:5.2rem;height:5.2rem;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--rule) 0);display:grid;place-items:center}
.ring::before{content:attr(data-t);width:4.1rem;height:4.1rem;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem}
/* pipeline */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(15.5rem,1fr);gap:.8rem;overflow-x:auto;padding-bottom:.8rem}
.col{background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--rule);border-radius:14px;padding:.7rem;min-height:14rem;display:flex;flex-direction:column;gap:.55rem}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col h4{margin:0;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.vcard{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--c,var(--rule));border-radius:10px;padding:.6rem .7rem;cursor:grab;display:grid;gap:.35rem;box-shadow:var(--shadow)}
.vcard:active{cursor:grabbing}
.vcard .t{font-family:var(--f-display);font-size:1.02rem;line-height:1.25;font-weight:500}
.vcard .m{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.vcard .mv{display:flex;justify-content:space-between;margin-top:.1rem}
.vcard .mv button{border:0;background:none;cursor:pointer;color:var(--muted);font-family:var(--f-ui);font-size:.75rem;padding:.1rem .3rem;border-radius:6px}.vcard .mv button:hover{color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden;font-family:var(--f-ui)}
.seg button{border:0;background:transparent;cursor:pointer;padding:.3rem .85rem;font-size:.8rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-family:var(--f-ui);font-size:.88rem}
.tbl th{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:.5rem .6rem;border-bottom:1.5px solid var(--ink);cursor:pointer;white-space:nowrap}
.tbl td{padding:.65rem .6rem;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:hover td{background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.wrapx{overflow-x:auto}
.fit{display:inline-flex;gap:2px}.fit i{width:.55rem;height:.9rem;border-radius:2px;background:var(--rule)}.fit i.on{background:var(--gold)}
.stat{font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
/* style lab */
.styles{display:grid;gap:1.2rem}
.style{display:grid;gap:1rem}
.style h3{margin:0;font-weight:500;font-size:1.7rem;display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap}
.style .letter{font-family:var(--f-kufi);font-size:2.4rem;color:var(--c);line-height:1}
.anat{display:flex;height:3rem;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.anat div{display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);font-size:.68rem;color:var(--ink);padding:0 .3rem;text-align:center;line-height:1.1;border-right:1px solid var(--card);background:color-mix(in srgb,var(--c) calc(var(--o)*100%),var(--card));cursor:default;min-width:0;overflow:hidden}
.anat div:last-child{border:0}
.axis{display:flex;justify-content:space-between;font-family:var(--f-ui);font-size:.68rem;color:var(--muted);margin-top:.25rem}
.rules{margin:0;padding-left:1.1rem;font-family:var(--f-ui);font-size:.88rem}.rules li{margin:.25rem 0}
.beats{display:grid;gap:.4rem;font-family:var(--f-ui);font-size:.85rem}
.beats div{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:.8rem;padding:.4rem 0;border-top:1px solid var(--rule)}
.beats b{font-variant-numeric:tabular-nums;color:var(--c)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(4,8,18,.5);z-index:50;display:none}.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(34rem,100%);background:var(--card);z-index:60;transform:translateX(102%);transition:transform .25s;border-left:1px solid var(--rule);display:flex;flex-direction:column;font-family:var(--f-ui)}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--rule)}
.drawer h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:1.3rem}
.drawer .bd{overflow:auto;padding:1rem 1.2rem 6rem;display:grid;gap:.8rem}
.drawer label{display:grid;gap:.25rem;font-size:.74rem;color:var(--muted)}
.drawer input,.drawer select,.drawer textarea{font-size:.92rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:.5rem .65rem;width:100%}
.drawer textarea{min-height:4.4rem;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.ai{white-space:pre-wrap;font-family:var(--f-display);font-size:.98rem;line-height:1.5;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:.8rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(20px);opacity:0;z-index:100;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:.86rem;padding:.55rem 1rem;border-radius:99px;transition:.25s;pointer-events:none}.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:4.4rem}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:.3rem .4rem calc(.3rem + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--rule);z-index:40;justify-content:space-around;gap:0}
  .rail .logo,.rail .sp,.rail .links{display:none}
  .rail button.nav{flex-direction:column;gap:.1rem;font-size:.66rem;padding:.35rem .4rem;text-align:center;min-width:0}
  .rail .badge{position:absolute;margin:0;transform:translate(.9rem,-.2rem)}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>

    <button class="nav" data-room="overview" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>Overview</button>
    <button class="nav" data-room="pipeline" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3v10M6.5 3v7M11 3v10M14.5 3v5" stroke-linecap="round"/></svg>Pipeline</button>

  <main id="main"></main>
</div>

<script>
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const DA_TITLES = /*DA_TITLES*/[];
  const STAGES = [['idea', 'Idea'], ['research', 'Research'], ['script', 'Script'], ['produce', 'Produce'], ['posted', 'Posted'], ['results', 'Results']];
  const SC = { A: 'var(--sA)', B: 'var(--sB)', C: 'var(--sC)' };
  const C = { videos: {}, claims: {}, accounts: {}, decisions: {}, log: {}, styles: {} };
  let db = null, room = store.get('sb:room') || 'overview', front = 'all';
  const t0 = () => new Date().toISOString();
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2000); }
  const day = ts => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
  const median = a => { a = a.filter(x => typeof x === 'number').sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  const fmt = n => n == null ? '–' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'k' : String(Math.round(n));

  /* ---------- data layer: shared db when available, this browser otherwise ---------- */
  function persistLocal(c) { store.set('sb:' + c, JSON.stringify(C[c])); }
  async function put(c, id, data) { C[c][id] = data; if (db) { try { await db.collection(c).doc(id).set(data); } catch (e) { persistLocal(c); toast('Saved here only'); } } else persistLocal(c); draw(); }
  async function patch(c, id, p) { await put(c, id, Object.assign({}, C[c][id], p)); }
  async function del(c, id) { delete C[c][id]; if (db) { try { await db.collection(c).doc(id).delete(); } catch (e) {} } else persistLocal(c); draw(); }
  const nid = () => 'x' + Math.random().toString(36).slice(2, 9);
  async function logIt(text, by) { await put('log', nid(), { at: t0(), by: by || 'you', text }); }
  Object.keys(C).forEach(c => { try { C[c] = JSON.parse(store.get('sb:' + c) || '{}'); } catch (e) { C[c] = {}; } });
  async function boot() {
    try {
      if (!window.claude || !window.claude.use) return;
      db = await window.claude.use('db'); if (!db) return;
      Object.keys(C).forEach(c => db.collection(c).onSnapshot(s => { C[c] = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); draw(); }, () => {}));
    } catch (e) { db = null; }
  }

  /* ---------- views ---------- */
  const rows = c => Object.entries(C[c]).map(([id, d]) => Object.assign({ id }, d));
  function head(title, extra) { return '<div class="top"><div><p class="eyebrow">' + esc(extra || 'Studio Board') + '</p><h1>' + title + '</h1></div><span class="date">' + new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + '</span></div>'; }

  function vOverview() {
    const vids = rows('videos');
    const fr = (k, name, sub, col) => {
      const v = vids.filter(x => x.front === k);

      '<div class="grid2" style="margin-top:1rem"><section class="card"><p class="eyebrow">Needs you</p><ul class="needs">' + (dec.length ? dec.map(d => '<li class="' + (d.status === 'done' ? 'done' : '') + '"><input type="checkbox" data-dec="' + d.id + '" ' + (d.status === 'done' ? 'checked' : '') + ' aria-label="Done"><span>' + esc(d.text) + (d.owner === 'claude' ? ' <span class="chip">Claude</span>' : '') + '</span></li>').join('') : '<li class="note-s">Nothing waiting.</li>') + '</ul><div style="margin-top:.8rem"><input id="newdec" placeholder="Add something that needs a decision" style="width:100%;font-family:var(--f-ui);background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:.5rem .7rem"></div></section>' +

      gapCard() +
      '<h2 class="sec">Results <small>views in the first 48 hours, by script style</small></h2><section class="card">' + chart(res) + (best ? '<p class="insight">So far <b style="color:' + SC[best[0]] + '">Style ' + best[0] + '</b> leads with a median of ' + fmt(best[1]) + ' views at 48 hours across ' + res.filter(v => v.style === best[0]).length + ' video' + (res.filter(v => v.style === best[0]).length > 1 ? 's' : '') + '.' + (res.length < 6 ? ' That is a small sample, so treat it as a lean, not a result.' : '') + '</p>' : '<p class="note-s" style="margin:.8rem 0 0">Enter the 48-hour numbers on a video in the Results column and this chart fills in.</p>') + '</section>' +
      '<h2 class="sec">Rhythm</h2><section class="card meterw"><div class="ring" style="--p:' + Math.min(100, 100 * wk / target) + '" data-t="' + wk + '/' + target + '"></div><div><b>Videos posted in the last 7 days</b><p class="note-s" style="margin:.2rem 0 .5rem">Weekly target: <input id="tgt" type="number" min="1" max="21" value="' + target + '" style="width:3.5rem;background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:.15rem .4rem;font-family:var(--f-ui)"></p></div></section>';

  function chart(res) {
    if (!res.length) return '<div class="empty">No results yet. After you post a video and wait 48 hours, add its views here.</div>';
    const s = res.slice().sort((a, b) => (a.postedAt || '') < (b.postedAt || '') ? -1 : 1), W = 640, H = 200, p = 28, mx = Math.max(...s.map(v => v.views48)), bw = Math.min(46, (W - 2 * p) / s.length - 8);

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Views at 48 hours per video"><line x1="' + p + '" y1="' + (H - p) + '" x2="' + (W - p) + '" y2="' + (H - p) + '" stroke="var(--rule)"/>' + bars + '</svg><div class="legend"><span><i style="background:var(--sA)"></i>A · Ali</span><span><i style="background:var(--sB)"></i>B · Challenge</span><span><i style="background:var(--sC)"></i>C · Versus</span></div>';

  /* ---------- interaction ---------- */
  function bind() {
    $$('[data-dec]').forEach(c => c.onchange = () => patch('decisions', c.dataset.dec, { status: c.checked ? 'done' : 'open' }));
    const nd = $('#newdec'); if (nd) nd.onkeydown = e => { if (e.key === 'Enter' && nd.value.trim()) { put('decisions', nid(), { text: nd.value.trim(), owner: 'you', status: 'open', at: t0() }); } };
    const tg = $('#tgt'); if (tg) tg.onchange = () => { store.set('sb:target', tg.value); draw(); };
    $$('[data-front]').forEach(b => b.onclick = () => { front = b.dataset.front; draw(); });
    const av = $('#addv'); if (av) av.onclick = () => openVideo(null);
    $$('[data-open]').forEach(b => b.onclick = () => openVideo(b.dataset.open));
    $$('[data-mv]').forEach(b => b.onclick = e => { const id = b.closest('.vcard').dataset.id, v = C.videos[id], i = STAGES.findIndex(x => x[0] === (v.stage || 'idea')) + (+b.dataset.mv); if (STAGES[i]) { patch('videos', id, { stage: STAGES[i][0], stageAt: t0(), postedAt: STAGES[i][0] === 'posted' && !v.postedAt ? t0() : v.postedAt }); } });
    $$('.vcard').forEach(c => { c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; }; });
    $$('.col').forEach(col => {
      col.ondragover = e => { e.preventDefault(); col.classList.add('over'); }; col.ondragleave = () => col.classList.remove('over');
      col.ondrop = e => { e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'), v = C.videos[id]; if (v && (v.stage || 'idea') !== col.dataset.stage) patch('videos', id, { stage: col.dataset.stage, stageAt: t0(), postedAt: col.dataset.stage === 'posted' && !v.postedAt ? t0() : v.postedAt }); };
    });
    const ac = $('#addc'); if (ac) ac.onclick = () => openClaim();
    const ig = $('#in-go'); if (ig) ig.onclick = runIntake;
    $$('[data-cs]').forEach(s => s.onchange = () => patch('claims', s.dataset.cs, { status: s.value }));
    $$('[data-dc]').forEach(b => b.onclick = () => del('claims', b.dataset.dc));
    $$('[data-mk]').forEach(b => b.onclick = () => { const c = C.claims[b.dataset.mk]; const id = nid(); put('videos', id, { title: c.text.slice(0, 90), front: c.lang === 'ar' ? 'ar' : 'en', stage: 'idea', claim: c.text, attacker: c.who || '', da: c.da || '', at: t0() }); patch('claims', b.dataset.mk, { status: 'queued' }); room = 'pipeline'; store.set('sb:room', room); draw(); openVideo(id); });
    const aa = $('#adda'); if (aa) aa.onclick = () => openAccount();
  }
  function drawer(title, html) { $('#dt').textContent = title; $('#db').innerHTML = html; $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); }
  function closeDrawer() { $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); }
  $('#dx').onclick = closeDrawer; $('#scrim').onclick = closeDrawer; document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  const fld = (l, id, v, type) => '<label>' + l + (type === 'area' ? '<textarea id="' + id + '">' + esc(v) + '</textarea>' : '<input id="' + id + '" value="' + esc(v) + '"' + (type === 'num' ? ' type="number" inputmode="numeric"' : '') + '>') + '</label>';
  const val = id => ($('#' + id) || {}).value;

  function openVideo(id) {
    const v = id ? C.videos[id] : { title: '', front: front === 'ar' ? 'ar' : 'en', stage: 'idea', style: '' };
    const numF = [['views48', 'Views at 48h'], ['likes', 'Likes'], ['saves', 'Saves'], ['shares', 'Shares'], ['comments', 'Comments'], ['follows', 'Followers gained']];
    drawer(id ? 'Edit video' : 'New video',
      fld('Working title', 'v-title', v.title) +
      '<div class="two"><label>Front<select id="v-front"><option value="en" ' + (v.front === 'en' ? 'selected' : '') + '>English (faceless, AI voice)</option><option value="ar" ' + (v.front === 'ar' ? 'selected' : '') + '>Arabic (on camera)</option></select></label>' +
      '<label>Script style<select id="v-style"><option value="">Not chosen</option>' + ['A', 'B', 'C'].map(s => '<option ' + (v.style === s ? 'selected' : '') + ' value="' + s + '">' + s + ' · ' + ({ A: 'Ali', B: 'Challenge clip', C: 'Versus' })[s] + '</option>').join('') + '</select></label></div>' +
      '<label>Stage<select id="v-stage">' + STAGES.map(([s, l]) => '<option ' + ((v.stage || 'idea') === s ? 'selected' : '') + ' value="' + s + '">' + l + '</option>').join('') + '</select></label>' +
      fld('The claim being answered (their words)', 'v-claim', v.claim || '', 'area') +
      '<div class="two">' + fld('Who said it', 'v-att', v.attacker || '') + fld('Library answer (part / argument)', 'v-da', v.da || '') + '</div>' +
      fld('Hook (first 3 seconds)', 'v-hook', v.hook || '') + fld('Notes, sources to show on screen', 'v-notes', v.notes || '', 'area') +
      '<p class="eyebrow" style="margin:.4rem 0 0">Results after 48 hours</p><div class="two">' + numF.map(([k, l]) => fld(l, 'v-' + k, v[k] == null ? '' : v[k], 'num')).join('') + '</div>' +
      '<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn pri" id="v-save" type="button">Save</button><button class="btn" id="v-hooks" type="button">✎ Hook ideas from Claude</button><button class="btn" id="v-obj" type="button">✎ Objection check</button>' + (id ? '<button class="btn" id="v-del" type="button">Delete</button>' : '') + '</div><div class="ai" id="v-ai" hidden></div>');
    $('#v-save').onclick = () => {
      const d = Object.assign({}, v, { title: val('v-title').trim() || 'Untitled', front: val('v-front'), style: val('v-style'), stage: val('v-stage'), claim: val('v-claim'), attacker: val('v-att'), da: val('v-da'), hook: val('v-hook'), notes: val('v-notes'), at: v.at || t0() });

      if (d.stage === 'posted' && !d.postedAt) d.postedAt = t0();
      put('videos', id || nid(), d); closeDrawer(); toast('Saved');
    };
    if ($('#v-del')) $('#v-del').onclick = () => { del('videos', id); closeDrawer(); };
    const ask = async (what) => {
      const out = $('#v-ai'); out.hidden = false; out.innerHTML = 'Thinking…';
      try {
        const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
        if (!sample) { out.textContent = 'This needs the page open inside Claude.'; return; }
        const st = C.styles[val('v-style')] || {};
        const ctx = 'Front: ' + (val('v-front') === 'ar' ? 'Arabic, creator on camera, Iraqi-flavoured formal Arabic' : 'English, faceless AI voice labeled as AI') + '\nClaim being answered: ' + val('v-claim') + '\nWho said it: ' + val('v-att') + '\nStyle: ' + (st.name || 'not chosen') + '\nStyle rules: ' + (st.rules || []).join(' | ') + '\nNotes and sources: ' + val('v-notes');
        const rules = 'Rules: use only sources given in the notes, never invent a verse, hadith, grading or quote. Tone firm and direct, light humor allowed, no insults, no call to action. ';
        const p = what === 'hooks' ? rules + 'Write 6 different hook lines for the first 3 seconds of this reel, each in a different pattern (challenge question, versus, contrarian reveal, direct address, bold claim, story open). One line each, then a one-line note on why it would work.\n\n' + ctx
          : rules + 'Act as the sharpest critic of this planned reel. List the 3 strongest replies the opponent could make, whether each can be answered inside the reel, and what source would be needed. Be concrete and brief.\n\n' + ctx;
        const r = await sample(p, { cache: false, onText: u => { out.textContent = u.text; } }); out.textContent = r.text;
      } catch (e) { out.textContent = 'Could not run that (' + ((e && e.code) || 'error') + ').'; }
    };
    $('#v-hooks').onclick = () => ask('hooks'); $('#v-obj').onclick = () => ask('obj');
  }
  async function runIntake() {
    const text = ($('#in-text').value || '').trim().slice(0, 10000), st = $('#in-st'), out = $('#in-out');
    if (text.length < 20) { st.textContent = 'Paste a bit more text first.'; return; }
    const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
    if (!sample) { st.textContent = 'This needs the page open inside Claude.'; return; }
    st.innerHTML = '<span>Reading…</span>'; out.innerHTML = '';
    const list = DA_TITLES.map((t, i) => (i + 1) + '. ' + t).join('\n');
    const prompt = 'You are a research assistant for a dawah content team. From the TEXT, extract the distinct claims made against Islam, the Quran, hadith or the Prophet (peace be upon him) that a reel could answer. Rules: stay faithful to the text, one claim per item, never invent a claim, skip insults and filler. For each claim choose the single best matching argument from the LIBRARY list by its exact title, or use an empty string if none really answers it (that is a library gap). Give priority 1 (hot, specific, widely repeated), 2, or 3. Reply as JSON only: {"claims":[{"text":"the claim in one sentence","who":"speaker if named in the text, else empty","lang":"en or ar","priority":1,"da":"exact title from the list or empty"}]}.\n\nLIBRARY:\n' + list + '\n\nTEXT:\n' + text;
    try {
      const r = await sample.json(prompt, { cache: false, modelTier: 'default' });
      const titles = new Set(DA_TITLES), who = ($('#in-who').value || '').trim();
      const cl = (r.claims || []).slice(0, 25).map(c => ({ text: String(c.text || '').slice(0, 400), who: String(c.who || who || '').slice(0, 80), lang: c.lang === 'ar' ? 'ar' : 'en', priority: [1, 2, 3].includes(+c.priority) ? +c.priority : 3, da: titles.has(c.da) ? c.da : '' })).filter(c => c.text);
      if (!cl.length) { st.textContent = 'No claims found in that text.'; return; }
      st.textContent = cl.length + ' claim' + (cl.length > 1 ? 's' : '') + ' found';
      out.innerHTML = '<table class="tbl" style="margin-top:.8rem"><tbody>' + cl.map((c, i) => '<tr><td style="width:2rem"><input type="checkbox" data-i="' + i + '" checked aria-label="Log this claim"></td><td>' + esc(c.text) + '<div class="note-s">' + (c.who ? esc(c.who) + ' · ' : '') + 'priority ' + c.priority + '</div></td><td style="width:34%">' + (c.da ? esc(c.da) : '<span class="chip" style="border-color:var(--warn);color:var(--warn)">Library gap</span>') + '</td></tr>').join('') + '</tbody></table><div style="margin-top:.8rem"><button class="btn pri" id="in-log" type="button">Log the selected claims</button></div>';
      $('#in-log').onclick = () => { let n = 0; $$('[data-i]', out).forEach(b => { if (b.checked) { const c = cl[+b.dataset.i]; put('claims', nid(), Object.assign({}, c, { gap: !c.da, status: 'new', where: 'Intake', at: t0() })); n++; } }); out.innerHTML = ''; st.textContent = ''; $('#in-text').value = ''; toast(n + ' logged'); };
    } catch (e) { st.textContent = e && e.code === 'not_granted' ? 'Not allowed, so nothing was sent.' : 'Could not read that (' + ((e && e.code) || 'error') + '). Try a shorter text.'; }
  }
  function openClaim() {
    drawer('Log a claim', fld('The claim, in their words', 'c-text', '', 'area') + '<div class="two">' + fld('Who said it', 'c-who', '') + fld('Where (platform, link)', 'c-where', '') + '</div>' +
      '<div class="two"><label>Language<select id="c-lang"><option value="en">English</option><option value="ar">Arabic</option></select></label><label>Priority<select id="c-pri"><option value="1">1 · hot</option><option value="2">2</option><option value="3" selected>3 · background</option></select></label></div>' + fld('Library answer, if you know it', 'c-da', '') + fld('Note', 'c-note', '') + '<div><button class="btn pri" id="c-save" type="button">Save</button></div>');
    $('#c-save').onclick = () => { if (!val('c-text').trim()) return; put('claims', nid(), { text: val('c-text').trim(), who: val('c-who'), where: val('c-where'), lang: val('c-lang'), priority: +val('c-pri'), da: val('c-da'), note: val('c-note'), status: 'new', at: t0() }); closeDrawer(); toast('Logged'); };
  }
  function openAccount() {
    drawer('Add account', fld('Handle (no @)', 'a-h', '') + '<div class="two"><label>Platform<select id="a-p"><option>Instagram</option><option>TikTok</option><option>YouTube</option></select></label><label>Language<select id="a-l"><option value="en">English</option><option value="ar">Arabic</option></select></label></div>' + fld('Role (reference, claim source, both)', 'a-r', 'reference') + fld('Note', 'a-n', '') + '<div><button class="btn pri" id="a-save" type="button">Save</button></div>');
    $('#a-save').onclick = () => { if (!val('a-h').trim()) return; put('accounts', nid(), { handle: val('a-h').trim().replace(/^@/, ''), platform: val('a-p'), lang: val('a-l'), role: val('a-r'), note: val('a-n'), fit: 0 }); closeDrawer(); };
  }

  $$('.rail .nav').forEach(b => b.onclick = () => { room = b.dataset.room; store.set('sb:room', room); draw(); window.scrollTo(0, 0); });
  $('#theme').onclick = e => { e.preventDefault(); const cur = document.documentElement.getAttribute('data-theme'); const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; const n = dark ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); store.set('sb:theme', n); };
  try { const th = store.get('sb:theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  draw(); boot();
})();
</script>
